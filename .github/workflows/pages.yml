name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version comes from the "packageManager" field in package.json.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Self-heal a repository where Pages was never enabled.
          enablement: true

      - name: Stage Pages site
        run: |
          # docs/ holds the landing page and demos; dist/ holds the built
          # demo bundle they import (../dist/demo.js). Both must be served
          # from the site root, so stage them into one artifact directory.
          mkdir -p _pages
          cp -R docs/. _pages/
          cp -R dist _pages/dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
